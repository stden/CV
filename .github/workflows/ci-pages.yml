name: Build, Validate, and Deploy Portfolio

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: portfolio-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions: {}

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      pages: read
    outputs:
      pages_source: ${{ steps.pages-source.outputs.mode }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "22"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright Chromium and PDF inspection tools
        run: |
          npx playwright install --with-deps chromium
          sudo apt-get update && sudo apt-get install -y poppler-utils

      - name: Build static site, SVG diagrams, and technology pages
        run: npm run build

      - name: Generate ATS-friendly PDF resumes and OG image
        run: npm run build:pdfs

      - name: Run static validation, SEO, PDF, and unit tests
        run: npm test

      - name: Run automated confidentiality verification
        env:
          CONFIDENTIAL_DENYLIST: ${{ secrets.CONFIDENTIAL_DENYLIST }}
        run: npm run check:confidentiality

      - name: Run Playwright E2E, responsiveness, and Axe accessibility tests
        run: npm run test:e2e

      - name: Stage and validate allowlisted public Pages artifact
        env:
          CONFIDENTIAL_DENYLIST: ${{ secrets.CONFIDENTIAL_DENYLIST }}
        run: |
          rm -rf _site
          mkdir -p _site
          cp index.html robots.txt sitemap.xml favicon.ico _site/
          cp -r assets cv tech _site/
          test -f _site/index.html
          test -f _site/cv/general.html
          test -f _site/cv/wise.html
          test -f _site/assets/pdf/Denis-Stepulenok-Senior-Software-Engineer.pdf
          test -f _site/assets/pdf/Denis-Stepulenok-Senior-Java-Engineer.pdf
          test -f _site/assets/pdf/Denis-Stepulenok-Distributed-Systems-Engineer.pdf
          test -f _site/assets/pdf/Denis-Stepulenok-Fintech-Engineer.pdf
          test -f _site/assets/pdf/Denis-Stepulenok-Wise-Senior-Java-Engineer.pdf
          test -f _site/assets/pdf/Denis-Stepulenok-AI-Engineer.pdf
          test -f _site/assets/pdf/Denis-Stepulenok-Full-CV.pdf
          test ! -e _site/applications
          test ! -e _site/vacancies
          test ! -e _site/CONTENT_REVIEW.md
          test ! -e _site/.confidential-denylist
          node scripts/check-confidentiality.js --site-dir _site

      - name: Upload Playwright failure diagnostics
        if: ${{ failure() }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: playwright-failure-diagnostics
          path: |
            playwright-report/
            test-results/
          if-no-files-found: ignore
          retention-days: 7

      - name: Check repository GitHub Pages source configuration
        if: github.ref == 'refs/heads/main'
        id: pages-source
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mode="$(gh api "repos/${GITHUB_REPOSITORY}/pages" --jq '.build_type')"
          echo "mode=$mode" >> "$GITHUB_OUTPUT"
          if [[ "$mode" != "workflow" ]]; then
            echo "::notice::GitHub Pages is currently configured for branch publishing ($mode). Switch Settings -> Pages -> Source to GitHub Actions to enforce validated deployment gating."
          fi

      - name: Upload GitHub Pages artifact
        if: github.ref == 'refs/heads/main' && steps.pages-source.outputs.mode == 'workflow'
        uses: actions/upload-pages-artifact@56afc609e74202658d3ffba0e8f6dda462b719fa # v3
        with:
          path: _site

  deploy:
    needs: validate
    if: github.ref == 'refs/heads/main' && needs.validate.outputs.pages_source == 'workflow'
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.publish.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: publish
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4
