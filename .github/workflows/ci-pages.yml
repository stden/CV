name: Validate and approve public portfolio

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
    inputs:
      approved_commit:
        description: Exact reviewed main commit SHA approved for publication
        required: false
        type: string

concurrency:
  group: portfolio-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      pages: read
    outputs:
      pages_source: ${{ steps.pages-source.outputs.mode }}
    env:
      APPROVED_RELEASE: ${{ github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main' && inputs.approved_commit == github.sha }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24"
          cache: npm

      - run: npm ci

      - name: Install Chromium and PDF inspection tools
        run: |
          npx playwright install --with-deps chromium
          sudo apt-get update && sudo apt-get install -y poppler-utils

      - name: Verify public project metadata
        if: env.APPROVED_RELEASE != 'true'
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: npm run verify:projects

      - name: Build generated portfolio and PDF resumes
        if: env.APPROVED_RELEASE != 'true'
        run: |
          log="$(mktemp)"
          trap 'rm -f "$log"' EXIT
          if ! npm run build:all > "$log" 2>&1; then
            echo "::error::PUBLIC_BUILD_FAILED"
            exit 1
          fi

      # Approved releases stage the committed snapshots from this exact SHA.
      - name: Validate the allowlisted public artifact
        env:
          CONFIDENTIAL_DENYLIST: ${{ github.ref == 'refs/heads/main' && secrets.CONFIDENTIAL_DENYLIST || '' }}
        run: npm run stage:public

      - name: Check HTML, PDF and content policy regressions
        run: |
          log="$(mktemp)"
          trap 'rm -f "$log"' EXIT
          if ! npm test > "$log" 2>&1; then
            echo "::error::PUBLIC_STATIC_OR_UNIT_TEST_FAILED"
            exit 1
          fi

      - name: Run browser and accessibility tests against the staged artifact
        env:
          CV_PUBLIC_ROOT: _site
        run: |
          log="$(mktemp)"
          trap 'rm -f "$log"' EXIT
          if ! npm run test:e2e > "$log" 2>&1; then
            echo "::error::PUBLIC_BROWSER_TEST_FAILED"
            exit 1
          fi

      - name: Verify that Pages uses validated workflow publishing
        if: github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main' && inputs.approved_commit == github.sha
        id: pages-source
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mode="$(gh api "repos/${GITHUB_REPOSITORY}/pages" --jq '.build_type')"
          if [[ "$mode" != workflow ]]; then
            echo "::error::PAGES_WORKFLOW_SOURCE_REQUIRED"
            exit 1
          fi
          echo "mode=workflow" >> "$GITHUB_OUTPUT"

      - name: Upload the reviewed public artifact
        if: steps.pages-source.outputs.mode == 'workflow'
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: _site
          include-hidden-files: true

  deploy:
    needs: validate
    if: github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main' && inputs.approved_commit == github.sha && needs.validate.outputs.pages_source == 'workflow'
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.publish.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: publish
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
