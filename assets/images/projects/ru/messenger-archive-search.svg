<svg xmlns="http://www.w3.org/2000/svg" xml:lang="ru" viewBox="0 0 420 644" width="420" height="644" role="img">
  <title>Семантический поиск и интеграция MCP (Независимый личный проект)</title>
  <desc>Личный архив: импорт сообщений, захват заданий с блокировкой строк, транскрибация, векторная индексация и поиск через MCP.</desc>
  <defs>
    <marker id="arrow-messenger-archive-search" markerWidth="10" markerHeight="10" refX="5" refY="9" orient="auto">
      <path d="M0,0 L5,9 L10,0" fill="#0f766e"/>
    </marker>
  </defs>
  <style>
    .box { fill: #f8fafc; stroke: #0f766e; stroke-width: 1.75; }
    .title { fill: #0f172a; font: 700 14.5px Inter, system-ui, -apple-system, sans-serif; }
    .detail { fill: #475569; font: 400 12.5px Inter, system-ui, -apple-system, sans-serif; }
    .link { stroke: #0f766e; stroke-width: 1.75; marker-end: url(#arrow-messenger-archive-search); }
  </style>
  <rect class="box" x="20" y="20" width="380" height="64" rx="8"/>
  <text class="title" x="38" y="47">1. API мессенджера (MTProto)</text>
  <text class="detail" x="38" y="68">История сообщений и голосовых вложений</text>
  <line class="link" x1="210" y1="84" x2="210" y2="108"/>
  <rect class="box" x="20" y="110" width="380" height="64" rx="8"/>
  <text class="title" x="38" y="137">2. Сервис синхронизации (Rust)</text>
  <text class="detail" x="38" y="158">Паузы по flood-wait и повторы</text>
  <line class="link" x1="210" y1="174" x2="210" y2="198"/>
  <rect class="box" x="20" y="200" width="380" height="64" rx="8"/>
  <text class="title" x="38" y="227">3. Хранилище и очередь PostgreSQL</text>
  <text class="detail" x="38" y="248">Захват свободных строк с блокировкой</text>
  <line class="link" x1="210" y1="264" x2="210" y2="288"/>
  <rect class="box" x="20" y="290" width="380" height="64" rx="8"/>
  <text class="title" x="38" y="317">4. Обработчик транскрибации (Python)</text>
  <text class="detail" x="38" y="338">Расшифровать аудио из задания</text>
  <line class="link" x1="210" y1="354" x2="210" y2="378"/>
  <rect class="box" x="20" y="380" width="380" height="64" rx="8"/>
  <text class="title" x="38" y="407">5. Пакетный индексатор (Rust)</text>
  <text class="detail" x="38" y="428">Записать векторы до обновления прогресса</text>
  <line class="link" x1="210" y1="444" x2="210" y2="468"/>
  <rect class="box" x="20" y="470" width="380" height="64" rx="8"/>
  <text class="title" x="38" y="497">6. Векторное хранилище Qdrant</text>
  <text class="detail" x="38" y="518">Детерминированные ID точек UUIDv5</text>
  <line class="link" x1="210" y1="534" x2="210" y2="558"/>
  <rect class="box" x="20" y="560" width="380" height="64" rx="8"/>
  <text class="title" x="38" y="587">7. Сервер MCP (stdio / HTTP)</text>
  <text class="detail" x="38" y="608">Интерфейс агентов для чтения</text>
</svg>
