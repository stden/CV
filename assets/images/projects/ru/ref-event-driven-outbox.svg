<svg xmlns="http://www.w3.org/2000/svg" xml:lang="ru" viewBox="0 0 420 554" width="420" height="554" role="img">
  <title>Транзакционный outbox и идемпотентный потребитель событий (Независимый учебный пример)</title>
  <desc>Учебная схема outbox от локальной транзакции до публикации, доставки и обработки дубликатов.</desc>
  <defs>
    <marker id="arrow-ref-event-driven-outbox" markerWidth="10" markerHeight="10" refX="5" refY="9" orient="auto">
      <path d="M0,0 L5,9 L10,0" fill="#0f766e"/>
    </marker>
  </defs>
  <style>
    .box { fill: #f8fafc; stroke: #0f766e; stroke-width: 1.75; }
    .title { fill: #0f172a; font: 700 14.5px Inter, system-ui, -apple-system, sans-serif; }
    .detail { fill: #475569; font: 400 12.5px Inter, system-ui, -apple-system, sans-serif; }
    .link { stroke: #0f766e; stroke-width: 1.75; marker-end: url(#arrow-ref-event-driven-outbox); }
  </style>
  <rect class="box" x="20" y="20" width="380" height="64" rx="8"/>
  <text class="title" x="38" y="47">1. Сервис бизнес-логики (Java / Spring)</text>
  <text class="detail" x="38" y="68">Записать данные и событие в outbox</text>
  <line class="link" x1="210" y1="84" x2="210" y2="108"/>
  <rect class="box" x="20" y="110" width="380" height="64" rx="8"/>
  <text class="title" x="38" y="137">2. Реляционная БД и таблица outbox</text>
  <text class="detail" x="38" y="158">Сохранить событие в локальной транзакции</text>
  <line class="link" x1="210" y1="174" x2="210" y2="198"/>
  <rect class="box" x="20" y="200" width="380" height="64" rx="8"/>
  <text class="title" x="38" y="227">3. Служба публикации outbox</text>
  <text class="detail" x="38" y="248">Отправить ожидающие события брокеру</text>
  <line class="link" x1="210" y1="264" x2="210" y2="288"/>
  <rect class="box" x="20" y="290" width="380" height="64" rx="8"/>
  <text class="title" x="38" y="317">4. Брокер сообщений (Kafka / AMQP)</text>
  <text class="detail" x="38" y="338">Доставить сообщения потребителям</text>
  <line class="link" x1="210" y1="354" x2="210" y2="378"/>
  <rect class="box" x="20" y="380" width="380" height="64" rx="8"/>
  <text class="title" x="38" y="407">5. Идемпотентный потребитель</text>
  <text class="detail" x="38" y="428">Обрабатывать повторы по ID события</text>
  <line class="link" x1="210" y1="444" x2="210" y2="468"/>
  <rect class="box" x="20" y="470" width="380" height="64" rx="8"/>
  <text class="title" x="38" y="497">6. Повторные попытки и DLQ</text>
  <text class="detail" x="38" y="518">Передать повторяющиеся сбои на разбор</text>
</svg>
