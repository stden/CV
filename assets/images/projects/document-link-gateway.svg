<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 642" role="img">
  <title>Document link flow: link service, database, background downloader, local file store and stateless gateway</title>
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="5" refY="9" orient="auto">
      <path d="M0,0 L5,9 L10,0" fill="#2f5d8a"/>
    </marker>
  </defs>
  <style>
    .box { fill: #ffffff; stroke: #2f5d8a; stroke-width: 1.5; }
    .title { fill: #1f3f5f; font: 700 15px Inter, Arial, sans-serif; }
    .detail { fill: #4a5566; font: 400 12.5px Inter, Arial, sans-serif; }
    .link { stroke: #2f5d8a; stroke-width: 1.5; marker-end: url(#arrow); }
  </style>
  <rect class="box" x="20" y="20" width="360" height="62" rx="6"/>
  <text class="title" x="36" y="46">1. Business application</text>
  <text class="detail" x="36" y="68">Requests a time-limited link to a document</text>
  <line class="link" x1="200" y1="82" x2="200" y2="110"/>
  <rect class="box" x="20" y="110" width="360" height="62" rx="6"/>
  <text class="title" x="36" y="136">2. Link service</text>
  <text class="detail" x="36" y="158">Issues AES-GCM links with their own expiry</text>
  <line class="link" x1="200" y1="172" x2="200" y2="200"/>
  <rect class="box" x="20" y="200" width="360" height="62" rx="6"/>
  <text class="title" x="36" y="226">3. PostgreSQL</text>
  <text class="detail" x="36" y="248">Stores link records</text>
  <line class="link" x1="200" y1="262" x2="200" y2="290"/>
  <rect class="box" x="20" y="290" width="360" height="62" rx="6"/>
  <text class="title" x="36" y="316">4. Background downloader</text>
  <text class="detail" x="36" y="338">Fetches the document into the local store</text>
  <line class="link" x1="200" y1="352" x2="200" y2="380"/>
  <rect class="box" x="20" y="380" width="360" height="62" rx="6"/>
  <text class="title" x="36" y="406">5. Local file store</text>
  <text class="detail" x="36" y="428">Holds documents until their links expire</text>
  <line class="link" x1="200" y1="442" x2="200" y2="470"/>
  <rect class="box" x="20" y="470" width="360" height="62" rx="6"/>
  <text class="title" x="36" y="496">6. Link gateway</text>
  <text class="detail" x="36" y="518">Decrypts the link and streams the document</text>
  <line class="link" x1="200" y1="532" x2="200" y2="560"/>
  <rect class="box" x="20" y="560" width="360" height="62" rx="6"/>
  <text class="title" x="36" y="586">7. Scheduled jobs</text>
  <text class="detail" x="36" y="608">Remove expired documents on each scheduler</text>
</svg>
