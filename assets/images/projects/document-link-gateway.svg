<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 420 554" width="420" height="554" role="img">
  <title>Document link flow: business application, encrypted token generator, lifecycle store, background downloader, file store, and stateless gateway</title>
  <defs>
    <marker id="arrow-document-link-gateway" markerWidth="10" markerHeight="10" refX="5" refY="9" orient="auto">
      <path d="M0,0 L5,9 L10,0" fill="#0f766e"/>
    </marker>
  </defs>
  <style>
    .box { fill: #f8fafc; stroke: #0f766e; stroke-width: 1.75; }
    .title { fill: #0f172a; font: 700 14.5px Inter, system-ui, -apple-system, sans-serif; }
    .detail { fill: #475569; font: 400 12.5px Inter, system-ui, -apple-system, sans-serif; }
    .link { stroke: #0f766e; stroke-width: 1.75; marker-end: url(#arrow-document-link-gateway); }
  </style>
  <rect class="box" x="20" y="20" width="380" height="64" rx="8"/>
  <text class="title" x="38" y="47">1. Business Application</text>
  <text class="detail" x="38" y="68">POST link request (JSON)</text>
  <line class="link" x1="210" y1="84" x2="210" y2="108"/>
  <rect class="box" x="20" y="110" width="380" height="64" rx="8"/>
  <text class="title" x="38" y="137">2. Link Generator API</text>
  <text class="detail" x="38" y="158">Mints AES-GCM token with expiry</text>
  <line class="link" x1="210" y1="174" x2="210" y2="198"/>
  <rect class="box" x="20" y="200" width="380" height="64" rx="8"/>
  <text class="title" x="38" y="227">3. Lifecycle Store (PostgreSQL)</text>
  <text class="detail" x="38" y="248">ACTIVE / BLOCKED / EXPIRED states</text>
  <line class="link" x1="210" y1="264" x2="210" y2="288"/>
  <rect class="box" x="20" y="290" width="380" height="64" rx="8"/>
  <text class="title" x="38" y="317">4. Background Downloader</text>
  <text class="detail" x="38" y="338">Fetches remote file, atomic move</text>
  <line class="link" x1="210" y1="354" x2="210" y2="378"/>
  <rect class="box" x="20" y="380" width="380" height="64" rx="8"/>
  <text class="title" x="38" y="407">5. Local File Cache</text>
  <text class="detail" x="38" y="428">Grouped by app and filename</text>
  <line class="link" x1="210" y1="444" x2="210" y2="468"/>
  <rect class="box" x="20" y="470" width="380" height="64" rx="8"/>
  <text class="title" x="38" y="497">6. Stateless Link Gateway</text>
  <text class="detail" x="38" y="518">Decrypts token &amp; streams file</text>
</svg>
