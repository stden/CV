<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 552" role="img">
  <title>XML transformation pipeline: RabbitMQ queues, router, XSLT transformer and error path</title>
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="5" refY="9" orient="auto">
      <path d="M0,0 L5,9 L10,0" fill="#35776d"/>
    </marker>
  </defs>
  <style>
    .box { fill: #fff; stroke: #35776d; stroke-width: 1.5; }
    .title { fill: #35776d; font: 700 15px Roboto, Arial, sans-serif; }
    .detail { fill: #545e6c; font: 400 12.5px Roboto, Arial, sans-serif; }
    .link { stroke: #35776d; stroke-width: 1.5; marker-end: url(#arrow); }
  </style>
  <rect class="box" x="20" y="20" width="360" height="62" rx="6"/>
  <text class="title" x="36" y="46">1. Upstream systems</text>
  <text class="detail" x="36" y="68">XML requests over AMQP</text>
  <line class="link" x1="200" y1="82" x2="200" y2="110"/>
  <rect class="box" x="20" y="110" width="360" height="62" rx="6"/>
  <text class="title" x="36" y="136">2. RabbitMQ request queue</text>
  <text class="detail" x="36" y="158">Each message goes to a bounded worker pool</text>
  <line class="link" x1="200" y1="172" x2="200" y2="200"/>
  <rect class="box" x="20" y="200" width="360" height="62" rx="6"/>
  <text class="title" x="36" y="226">3. Router</text>
  <text class="detail" x="36" y="248">Checks the out-queue and routes the message</text>
  <line class="link" x1="200" y1="262" x2="200" y2="290"/>
  <rect class="box" x="20" y="290" width="360" height="62" rx="6"/>
  <text class="title" x="36" y="316">4. XSLT transformer</text>
  <text class="detail" x="36" y="338">Cached stylesheets, Java extensions from plugin jars</text>
  <line class="link" x1="200" y1="352" x2="200" y2="380"/>
  <rect class="box" x="20" y="380" width="360" height="62" rx="6"/>
  <text class="title" x="36" y="406">5. Out-queues</text>
  <text class="detail" x="36" y="428">Messages delivered to destination queues</text>
  <line class="link" x1="200" y1="442" x2="200" y2="470"/>
  <rect class="box" x="20" y="470" width="360" height="62" rx="6"/>
  <text class="title" x="36" y="496">6. Error path</text>
  <text class="detail" x="36" y="518">Failures are emailed and the message is requeued</text>
</svg>
